## Dicionário de idioma de `MT-11` — dado versionado, não lista embutida no teste
##
## `MT-11` percorre os identificadores de implementação de `src/radar/**`, `scripts/**` e
## `db/schema.sql` e exige que estejam em português (`D72`, `R94.2`, `R97.3`). Este arquivo é a
## **única** fonte das exceções e do vocabulário em inglês que o meta-teste reconhece.
##
## Acrescentar entrada aqui é **mudança revisável**: aparece no diff, tem motivo declarado e
## passa por revisão de código. Não existe escape silencioso — o teste não tem lista interna.
##
## Três classes de exceção são permitidas, e apenas estas (`D72`):
##   1. `[tecnologia]` — nomes de tecnologia e de biblioteca externa. A lista é **fechada**: é a
##      declarada na *Convenção de idioma* do design mais as de `D103`. `MT-11` verifica que
##      nada além dela aparece aqui, o que impede inflar a exceção disfarçando-a de tecnologia.
##   2. `[[contrato]]` — identificadores exigidos por API, contrato ou formato de terceiro. Cada
##      entrada declara o **motivo**, e o motivo é o que a revisão julga.
##   3. `[reservadas]` — palavras reservadas da linguagem e nomes de parâmetro que a própria
##      linguagem fixa. Nomes `__assim__` são dispensados pela estrutura do teste, não por lista.
##
## `[codigos_estaveis]` não é exceção de idioma: são os códigos que `D72` determina **não**
## renomear, porque são citados em todo o requirements.
##
## Regra de manutenção de `[termos_em_ingles]`: o teste também reconhece o plural em inglês
## reduzindo `-s`, `-es`, `-ies` e `-ses`. Por isso **nenhum termo aqui pode coincidir com o
## radical de um plural português** (`componentes` → `component`, `limites` → `limit`,
## `fontes` → `font`, `tipos` → `tip`, `partes` → `part`, `listas` → `list`): termo assim
## acusaria o idioma em lugar do defeito, e está proibido nesta tabela.

[tecnologia]
# Lista fechada: `D72` (*Convenção de idioma*) mais as exceções de `D103`.
termos = [
    "FastAPI",
    "LangGraph",
    "LangChain",
    "SQLAlchemy",
    "pgvector",
    "PostgreSQL",
    "hypothesis",
    "pytest",
    "ruff",
    "mypy",
    "pydantic",
    "React",
    "Decimal",
    "IntEnum",
    "StrEnum",
    "Protocol",
    "UUID",
    "MCP",
    "RAG",
    "OCR",
    "S3",
    "OpenAI",
    "Bedrock",
    "cron",
]

[reservadas]
# Palavras reservadas e nomes de parâmetro fixados pela linguagem. Nomes `__assim__` são
# dispensados pela estrutura do teste.
termos = ["self", "cls", "args", "kwargs"]

[codigos_estaveis]
# Códigos que `D72` determina **não** renomear. Comparados com o identificador inteiro.
padroes = [
    '(RULE|MC|B|C|REG|MT|CUS|GLB|INV|LOC|TIP|PRI|VAL|CMP|REN|LIQ|RISK|CONF|SCORE|PORT|EXC|ALT|MON|IA|AQ|PLT|HS|PL|RL|HL|SAFE)([_-][A-Z]+)*[_-]\d+',
    'E0[1-9]',
    'G[0-7]',
    'G1[_-]P',
    'I[0-4]',
    'P[_-][A-E]',
    'FRESH',
    'STR',
    '[DRP]\d+([._]\d+)*',
]

# --- Identificadores exigidos por API, contrato ou formato de terceiro -----------------------

[[contrato]]
termo = "tenant_id"
motivo = "coluna declarada literalmente em `R118.1`; o termo de negócio é **titular** (`D103`)"

[[contrato]]
termo = "api"
motivo = "`radar/api/**` está no mapa de módulos do design; `src/radar/api/nomes.py` em `D72`"

[[contrato]]
termo = "db"
motivo = "`radar/db/**` está no mapa de módulos do design (correções `D.10.5`, `D.10.6`)"

[[contrato]]
termo = "pipeline"
motivo = "`radar/pipeline/**` é pacote de núcleo em `D101`; `FaseDoPipeline` em `D72`"

[[contrato]]
termo = "gate"
motivo = "`Gate_Juridico` é nome de sistema do glossário, declarado por `D72` como já em português"

[[contrato]]
termo = "endpoint"
motivo = "valor de `EstrategiaDeCaptura` e módulo `radar/adaptadores/captura/endpoint.py` (`D94`)"

[[contrato]]
termo = "enum"
motivo = "`Enum`, `IntEnum` e `StrEnum` da biblioteca padrão"

[[contrato]]
termo = "datetime"
motivo = "tipo da biblioteca padrão, usado como nome na fronteira de interpretação"

[[contrato]]
termo = "hash"
motivo = "usado literalmente pelo design: `hash_do_arquivo`, `hash_do_conteudo`, `hash_do_segmento`"

[[contrato]]
termo = "embedding"
motivo = "mantido pelo identificador canônico `ProvedorDeEmbedding` (`D103`, `R98.2`)"

[[contrato]]
termo = "mime"
motivo = "nome do formato de terceiro; o design declara `tipo_mime`"

[[contrato]]
termo = "uri"
motivo = "identificador de formato de terceiro (RFC 3986), usado pelo design em documentos"

[[contrato]]
termo = "payload"
motivo = "usado literalmente pelo design na classificação incremental (`R108.1`)"

[[contrato]]
termo = "model_config"
motivo = "atributo exigido pelo `pydantic` em `BaseModel` e `BaseSettings`"

[[contrato]]
termo = "valuation"
motivo = "declarado pelo contrato de programação do design: `MetodoDeValuation`, `Motor_de_Valuation`, tabela `valuations` (`R23.1`, `R24.2` a `R24.5`)"

[[contrato]]
termo = "yield"
motivo = "declarado pelo contrato de programação do design: `yield_liquido_mensal_min` nos limiares de estratégia (`R44`, `R53.1.7`)"

